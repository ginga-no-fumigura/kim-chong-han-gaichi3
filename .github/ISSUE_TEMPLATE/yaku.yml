name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 金鍾漢 詩篇（『〈外地〉の日本語文学選3 朝鮮』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: kim-chong-han-gaichi3-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
